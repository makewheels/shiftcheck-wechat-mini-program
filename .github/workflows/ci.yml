name: CI

# 门禁：PR 与 master 推送都要跑
# 注意这里跑不了小程序模拟器（微信开发者工具没有 Linux 版，且需要扫码登录），
# 所以 CI 覆盖的是纯逻辑层：排班算法、日历渲染数据、结构完整性、代码卫生。
# 界面层（渲染、换行、点击手感）仍需人工在开发者工具或真机上过一遍。
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与本地开发用的版本保持一致（本机 v24.x）。
          # 曾经跑 22+24 双矩阵，但真正的教训是「本地与 CI 必须同版本」，
          # 而不是「要多测几个版本」：本地 24、CI 22 才会出现本地绿、CI 红的纯版本噪音。
          # 测试用的是 Node 内置能力（node:test / node:assert），不依赖新版本特性。
          node-version: '24'

      - name: 单元与门禁测试（node:test，零依赖）
        run: node --test test/*.test.js

      - name: 全部业务 js 语法检查
        run: |
          fail=0
          for f in $(find app.js pages utils components -name '*.js'); do
            node --check "$f" || { echo "语法错误: $f"; fail=1; }
          done
          exit $fail

      - name: 全部 json 可解析
        run: |
          fail=0
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" \
              || { echo "JSON 错误: $f"; fail=1; }
          done
          exit $fail

      - name: 小程序包体积参考（不含 libs 的第三方 SDK）
        run: |
          echo "业务代码体积："
          du -sh --exclude=libs --exclude=.git --exclude=test . || true
          echo "各目录："
          du -sh pages utils components libs 2>/dev/null || true
